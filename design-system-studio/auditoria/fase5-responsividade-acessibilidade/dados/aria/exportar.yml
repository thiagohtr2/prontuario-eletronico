- main:
  - navigation "Você está em":
    - list:
      - listitem:
        - link "Início":
          - /url: "#/"
      - listitem:
        - text: ›
        - link "Entrega":
          - /url: "#/livre"
      - listitem: ›Exportar e importar
  - text: Entrega
  - heading "Exportar e importar" [level=1]
  - paragraph: Todos os arquivos são gerados a partir do estado atual do projeto e são válidos. Demonstrações em HTML de templates e de sites de inspiração ficam nos respectivos módulos.
  - heading "Exportar" [level=2]
  - article:
    - heading "Master Prompt (.md)" [level=3]
    - paragraph: Texto completo com todas as decisões aprovadas, pronto para colar na IA.
    - button "Baixar"
    - button "Copiar":
      - img
      - text: Copiar
  - article:
    - heading "Especificação JSON" [level=3]
    - paragraph: "A fonte da verdade: estrutura, tokens, componentes, regras e o estado do projeto (reimportável)."
    - button "Baixar"
    - button "Copiar":
      - img
      - text: Copiar
  - article:
    - heading "CSS de referência" [level=3]
    - paragraph: Variáveis CSS dos tokens, tipografia, raios, sombras e espaçamentos, com regras base.
    - button "Baixar"
    - button "Copiar":
      - img
      - text: Copiar
  - article:
    - heading "Ficha do projeto (HTML)" [level=3]
    - paragraph: Documento autônomo com prévia da identidade, tokens, decisões e o Master Prompt.
    - button "Baixar"
  - article:
    - heading "Backup completo" [level=3]
    - paragraph: Projeto atual e 0 versão(ões) salva(s), para reutilizar depois ou em outro computador.
    - button "Baixar"
  - heading "Importar" [level=2]
  - paragraph: Aceita backups, projetos e especificações JSON exportados pelo Studio. Antes de importar, o projeto atual é salvo como versão.
  - strong: Arraste um arquivo .json para cá
  - text: ou
  - button "Escolher arquivo"
  - button "Arquivo para importar"
