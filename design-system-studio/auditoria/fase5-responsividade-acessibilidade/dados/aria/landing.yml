      - listitem: ›Landing pages
  - text: Estrutura
  - heading "Landing page" [level=1]
  - paragraph: "A landing page é a página pública que apresenta o seu produto ou serviço para quem ainda não o conhece e convida a pessoa a agir — assinar, comprar, agendar ou entrar. Ela não é a tela de login: é a vitrine que vem antes."
  - region "Como as pessoas chegam ao seu sistema?":
    - heading "Como as pessoas chegam ao seu sistema?" [level=2]
    - paragraph: Escolha o caminho de entrada. Ele define se o projeto terá landing page, login, as duas coisas ou nenhuma.
    - img
    - strong: Landing page não é login.
    - text: A landing apresenta o produto para quem ainda não conhece. O login é a porta da área restrita. Um sistema pode ter os dois, só um deles ou nenhum.
    - group "Fluxo de entrada":
      - 'button "Landing page com chamada para login Página pública de apresentação e um botão “Entrar” que leva ao login do sistema. Ex.: um sistema de gestão com página de vendas e área de clientes."'
      - 'button "Landing page sem login Só a página de apresentação. Não existe área restrita. Ex.: divulgação de um produto, evento ou serviço."'
      - text: Selecionado
      - 'button "Apenas login O endereço abre direto na tela de entrar. Sem página de apresentação. Ex.: ferramenta interna de uma empresa." [pressed]'
      - 'button "Aplicação diretamente O sistema abre direto na tela principal, sem apresentação nem login. Ex.: calculadora, painel de TV ou quiosque."'
      - 'button "Página institucional Site informativo da empresa ou serviço, com várias seções públicas. Ex.: site de uma clínica, escritório ou escola."'
  - region "Biblioteca de landing pages":
    - heading "Biblioteca de landing pages" [level=2]
    - paragraph: 24 conceitos com 12 estruturas realmente diferentes. Clique em um cartão para escolher; use “Ver prévia” para ver a página inteira no computador e no celular.
    - img
    - strong: O fluxo escolhido não tem landing page.
    - text: Você marcou “Apenas login”. Pode escolher uma landing mesmo assim, mas ela só entra no projeto se você mudar o fluxo de entrada. Landing selecionada Nenhum modelo escolhido ainda.
    - button "Ver prévia" [disabled]:
      - img
      - text: Ver prévia
    - searchbox "Buscar landing pages"
    - group "Filtrar por arquitetura":
