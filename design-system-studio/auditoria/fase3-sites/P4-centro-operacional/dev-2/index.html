  <title>Centro Operacional</title>
  <meta name="description" content="Centro Operacional: dados operacionais e indicadores em uma única tela.">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<div class="shell" id="shell" data-tab-mobile="kpis" data-tab-medium="painel">

  <!-- ===== Header / topbar ===== -->
  <header class="app-header" id="header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-activity"/></svg></span>
      <span class="brand-name">Centro Operacional</span>
    </div>

    <!-- Abas da faixa média (768–1279 px): grade ⇄ alertas -->
    <div class="tabs tabs--medium" id="tabs-medium" role="tablist" aria-label="Seções do painel" aria-orientation="horizontal">
      <button class="tab" type="button" role="tab" id="mtab-painel" aria-controls="content" aria-selected="true" aria-current="page" data-tab="painel">Painel</button>
      <button class="tab" type="button" role="tab" id="mtab-alertas" aria-controls="panel-alerts" aria-selected="false" tabindex="-1" data-tab="alertas">Alertas <span class="tab-count" data-alert-count>0</span></button>
    </div>

    <div class="header-actions">
      <button class="btn btn--secondary" type="button" id="btn-live" aria-keyshortcuts="P">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-pause"/></svg>
        <span class="btn-label">Pausar</span>
        <kbd class="kbd" aria-hidden="true">P</kbd>
      </button>
      <button class="btn btn--primary" type="button" id="btn-report" aria-keyshortcuts="R" aria-haspopup="dialog">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-file-text"/></svg>
        <span class="btn-label">Relatório</span>
        <kbd class="kbd" aria-hidden="true">R</kbd>
      </button>
    </div>
  </header>

  <!-- Abas móveis (< 768 px): topbar + abas fixas no topo -->
  <div class="tabs tabs--mobile" id="tabs-mobile" role="tablist" aria-label="Seções do painel" aria-orientation="horizontal">
    <button class="tab" type="button" role="tab" id="tab-kpis" aria-controls="panel-kpis" aria-selected="true" aria-current="page" data-tab="kpis">Indicadores</button>
    <button class="tab" type="button" role="tab" id="tab-ops" aria-controls="panel-ops" aria-selected="false" tabindex="-1" data-tab="ops">Operação</button>
    <button class="tab" type="button" role="tab" id="tab-data" aria-controls="panel-data" aria-selected="false" tabindex="-1" data-tab="data">Dados</button>
    <button class="tab" type="button" role="tab" id="tab-alerts" aria-controls="panel-alerts" aria-selected="false" tabindex="-1" data-tab="alerts">Alertas <span class="tab-count" data-alert-count>0</span></button>
  </div>

  <!-- ===== Conteúdo central ===== -->
  <main class="content" id="content" tabindex="-1">
    <noscript><p class="noscript">Este painel precisa de JavaScript para exibir os dados em tempo real.</p></noscript>

    <!-- Indicadores (componente "Indicadores — Compact Pro") -->
    <section class="panel panel--kpis" id="panel-kpis" aria-labelledby="h-kpis">
      <h2 class="sr-only" id="h-kpis">Indicadores</h2>
      <div class="scroll" data-scroll>
        <div class="scroll-body kpi-grid" id="kpi-grid" data-label="Indicadores"></div>
      </div>
    </section>

    <!-- Blocos de status: filas, SLA, equipes -->
    <section class="panel panel--ops" id="panel-ops" aria-labelledby="h-ops">
      <h2 class="sr-only" id="h-ops">Operação: filas, SLA e equipes</h2>
      <div class="scroll" data-scroll>
        <div class="scroll-body ops-grid" id="ops-grid" data-label="Filas, SLA e equipes"></div>
      </div>
    </section>

    <!-- Dados operacionais (componente "Dados operacionais — Compact Pro") -->
    <section class="panel panel--data" id="panel-data" aria-labelledby="h-data">
      <div class="summary" id="data-summary" aria-label="Resumo dos pedidos"></div>

      <div class="panel-head">
        <div class="panel-title">
          <h2 id="h-data">Pedidos recentes</h2>
          <p class="panel-sub" id="data-sub">Dados operacionais</p>
        </div>
        <div class="toolbar" role="toolbar" aria-label="Ações da tabela de pedidos">
          <div class="field field--inline">
            <label class="field-label" for="filter-client">Filtrar cliente</label>
            <span class="input-wrap">
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-search"/></svg>
              <input class="input" id="filter-client" type="search" placeholder="Nome do cliente" autocomplete="off" aria-keyshortcuts="/">
              <kbd class="kbd" aria-hidden="true">/</kbd>
            </span>
          </div>
          <button class="btn btn--secondary" type="button" id="btn-export">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-download"/></svg>
            <span class="btn-label" id="btn-export-label">Exportar CSV</span>
          </button>
          <button class="btn btn--secondary" type="button" id="btn-sim" aria-haspopup="menu" aria-expanded="false">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-refresh-cw"/></svg>
            <span class="btn-label">Simular estado</span>
            <svg class="icon icon--end" aria-hidden="true" focusable="false"><use href="#i-chevron-down"/></svg>
          </button>
        </div>
      </div>

      <!-- Controles equivalentes ao cabeçalho da tabela, só no celular (cartões) -->
      <div class="mobile-controls" id="mobile-controls">
        <label class="check check--label">
          <input type="checkbox" id="chk-all-m">
          <span><span class="sr-only">Selecionar </span>Todos</span>
        </label>
        <div class="field field--inline">
          <label class="field-label" for="sort-m">Ordenar</label>
          <select class="input input--select" id="sort-m">
            <option value="data:desc">Mais recentes</option>
            <option value="data:asc">Mais antigos</option>
            <option value="cliente:asc">Cliente A–Z</option>
            <option value="cliente:desc">Cliente Z–A</option>
            <option value="valor:desc">Maior valor</option>
            <option value="valor:asc">Menor valor</option>
            <option value="status:asc">Status A–Z</option>
            <option value="status:desc">Status Z–A</option>
          </select>
        </div>
      </div>

      <div class="scroll" data-scroll id="table-scroll">
        <div class="scroll-body table-wrap" data-label="Tabela de pedidos recentes">
          <table class="tbl" id="tbl" role="table">
            <caption class="sr-only">Pedidos recentes</caption>
            <thead role="rowgroup">
              <tr role="row">
                <th scope="col" role="columnheader" class="col-check">
                  <label class="check"><input type="checkbox" id="chk-all" aria-label="Selecionar todos os pedidos"></label>
                </th>
                <th scope="col" role="columnheader" aria-sort="none" data-col="cliente"><button class="th-btn" type="button" data-sort="cliente">Cliente<svg class="icon" aria-hidden="true" focusable="false"><use href="#i-chevrons-up-down"/></svg></button></th>
                <th scope="col" role="columnheader" aria-sort="none" data-col="status"><button class="th-btn" type="button" data-sort="status">Status<svg class="icon" aria-hidden="true" focusable="false"><use href="#i-chevrons-up-down"/></svg></button></th>
                <th scope="col" role="columnheader" aria-sort="none" data-col="valor" class="num"><button class="th-btn" type="button" data-sort="valor">Valor<svg class="icon" aria-hidden="true" focusable="false"><use href="#i-chevrons-up-down"/></svg></button></th>
                <th scope="col" role="columnheader" aria-sort="none" data-col="data"><button class="th-btn" type="button" data-sort="data">Data<svg class="icon" aria-hidden="true" focusable="false"><use href="#i-chevrons-up-down"/></svg></button></th>
                <th scope="col" role="columnheader" class="col-actions"><span class="sr-only">Ações</span></th>
              </tr>
            </thead>
            <tbody id="tbody" role="rowgroup"></tbody>
          </table>
          <div class="state" id="table-state" hidden></div>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== Coluna de alertas ===== -->
  <aside class="panel panel--alerts" id="panel-alerts" aria-labelledby="h-alerts">
    <div class="panel-head panel-head--alerts">
      <div class="panel-title">
        <h2 id="h-alerts">Alertas</h2>
        <p class="panel-sub" id="alerts-sub">Mais recentes primeiro</p>
      </div>
      <div class="chips" id="alert-filters" role="group" aria-label="Filtrar alertas por severidade">
        <button class="chip" type="button" data-filter="all" aria-pressed="true">Todos <span class="chip-n" data-n="all">0</span></button>
        <button class="chip" type="button" data-filter="critical" aria-pressed="false">Crítico <span class="chip-n" data-n="critical">0</span></button>
        <button class="chip" type="button" data-filter="warning" aria-pressed="false">Atenção <span class="chip-n" data-n="warning">0</span></button>
        <button class="chip" type="button" data-filter="info" aria-pressed="false">Info <span class="chip-n" data-n="info">0</span></button>
      </div>
    </div>
    <div class="scroll" data-scroll id="alerts-scroll">
      <div class="scroll-body" data-label="Lista de alertas">
        <ol class="alert-list" id="alert-list" aria-live="polite" aria-relevant="additions" aria-label="Alertas, do mais recente ao mais antigo"></ol>
        <div class="state" id="alerts-state" hidden></div>
      </div>
    </div>
  </aside>

  <!-- ===== Barra de status ===== -->
  <footer class="statusbar" id="statusbar" aria-label="Barra de status">
    <span class="sb-item"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-clock"/></svg><span class="sb-date" id="sb-date"></span><time id="clock">--:--:--</time></span>
    <span class="sb-item sb-conn" id="conn" role="status" data-state="online"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-wifi"/></svg><span id="conn-text">Conectado</span></span>
    <span class="sb-item sb-last">Atualizado <time id="last-update">--:--:--</time></span>
  </footer>
</div>

<!-- Região de avisos (toasts) -->
<div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

<!-- Diálogo de relatório / detalhes -->
<dialog class="dialog" id="dialog" aria-labelledby="dialog-title">
  <div class="dialog-card">
    <header class="dialog-head">
      <h2 id="dialog-title">Relatório</h2>
      <button class="btn btn--icon btn--ghost" type="button" id="dialog-close" aria-label="Fechar">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-x"/></svg>
      </button>
    </header>
    <div class="dialog-body" id="dialog-body" tabindex="-1"></div>
    <footer class="dialog-foot" id="dialog-foot"></footer>
  </div>
</dialog>

<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
